<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear cuenta · Librería Raudskinna</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <header class="encabezado">
      <div class="contenedor">
        <a class="logo" href="index.html"
          ><img src="img/logo.png" alt="Librería Raudskinna"
        /></a>
        <nav aria-label="Principal">
          <ul class="menu">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="registro.html" aria-current="page">Cuenta</a></li>
            <li><a href="mis-ordenes.html">Mis órdenes</a></li>
            <li><a href="carrito.html">Carrito</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="contenedor">
      <section class="panel registro">
        <h1>Crear cuenta</h1>
        <p class="registro-texto">
          Regístrate para realizar compras y consultar el historial de tus
          órdenes.
        </p>

        <form class="formulario">
          <label for="nombre">Nombre completo</label>
          <input
            class="campo campo-formulario"
            id="nombre"
            name="nombre"
            type="text"
            placeholder="Ej. Ana López"
            autocomplete="name"
            required
          />

          <label for="correo">Correo electrónico</label>
          <input
            class="campo campo-formulario"
            id="correo"
            name="correo"
            type="email"
            placeholder="correo@ejemplo.com"
            autocomplete="email"
            required
          />

          <label for="contrasena">Contraseña</label>
          <input
            class="campo campo-formulario"
            id="contrasena"
            name="contrasena"
            type="password"
            placeholder="Mínimo 8 caracteres"
            minlength="8"
            autocomplete="new-password"
            required
          />

          <label for="telefono">Teléfono</label>
          <input
                  class="campo-formulario"
                  type="tel"
                  id="telefono"
                  name="telefono"
                  placeholder="Número de contacto"
          />

          <label for="confirmar">Confirmar contraseña</label>
          <input
            class="campo campo-formulario"
            id="confirmar"
            name="confirmar"
            type="password"
            placeholder="Repite tu contraseña"
            minlength="8"
            autocomplete="new-password"
            required
          />

          <button class="boton boton-primario" type="submit">
            Registrarme
          </button>
          <p class="formulario-enlace">
            ¿Ya tienes cuenta? <a href="iniciar-sesion.html">Iniciar sesión</a>
          </p>
        </form>
      </section>
    </main>

    <footer class="pie">
      <div class="contenedor">
        <span>Librería Raudskinna</span>
        <nav aria-label="Pie de página">
          <a href="index.html">Inicio</a> ·
          <a href="catalogo.html">Catálogo</a> ·
          <a href="carrito.html">Carrito</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
