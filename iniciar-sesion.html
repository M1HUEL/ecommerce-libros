<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión · Librería Raudskinna</title>
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <header class="encabezado">
      <div class="contenedor">
        <a class="logo" href="index.html"
          ><img src="img/logo.png" alt="Librería Raudskinna"
        /></a>
        <nav aria-label="Principal">
          <ul class="menu">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li>
              <a href="iniciar-sesion.html" aria-current="page">Cuenta</a>
            </li>
            <li><a href="mis-ordenes.html">Mis órdenes</a></li>
            <li><a href="carrito.html">Carrito</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="contenedor">
      <section class="panel registro registro-estrecho">
        <h1>Iniciar sesión</h1>
        <p class="registro-texto">
          Accede a tu cuenta para continuar con tus compras y consultar tus
          órdenes.
        </p>

        <form class="formulario">
          <label for="correo">Correo electrónico</label>
          <input
            class="campo campo-formulario"
            id="correo"
            name="correo"
            type="email"
            placeholder="correo@ejemplo.com"
            autocomplete="email"
            required
          />

          <label for="contrasena">Contraseña</label>
          <input
            class="campo campo-formulario"
            id="contrasena"
            name="contrasena"
            type="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            required
          />

          <button class="boton boton-primario" type="submit">
            Iniciar sesión
          </button>
        </form>

        <div class="alterno">
          <p>¿Aún no tienes cuenta?</p>
          <a class="boton boton-claro" href="registro.html">Crear cuenta</a>
        </div>
      </section>
    </main>

    <footer class="pie">
      <div class="contenedor">
        <span>Librería Raudskinna</span>
        <nav aria-label="Pie de página">
          <a href="index.html">Inicio</a> ·
          <a href="catalogo.html">Catálogo</a> ·
          <a href="carrito.html">Carrito</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
